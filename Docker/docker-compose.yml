# One service: web UI + training/inference jobs (Detectron2, Ultralytics, stub).
# Weight files stay on the host (weights/, projects/*/weights/). They are never baked into the image.
# GPU: NVIDIA Container Toolkit on the host. `runtime: nvidia` is required on some
# machines (the Compose `deploy.devices` / `--gpus` path can fail NVML even when
# host nvidia-smi works).
#
# If `up` fails with NVML / "Driver Not Loaded" / CDI errors, the host driver is
# missing — often `prime-select` is on intel after suspend. Check with `nvidia-smi`.
# To start on CPU, comment out `runtime:` and the `deploy:` block.

services:
  app:
    pull_policy: missing
    runtime: nvidia
    build:
      context: ..
      dockerfile: Docker/Dockerfile
      pull: false
    ports:
      - "8000:8000"
    volumes:
      - ../projects:/data/projects
      - ../Datasets:/data/datasets
      - ../weights:/data/weights
    environment:
      AITEM_PROJECTS_DIR: /data/projects
      AITEM_DATASETS_DIR: /data/datasets
      AITEM_WEIGHTS_DIR: /data/weights
      HOST_UID: "${HOST_UID:-1000}"
      HOST_GID: "${HOST_GID:-1000}"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
