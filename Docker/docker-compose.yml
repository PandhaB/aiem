# One service: web UI + Detectron2 jobs.
# Weight files stay on the host (weights/, projects/*/weights/). They are never baked into the image.
# GPU: NVIDIA Container Toolkit on the host. If `up` fails with a nvidia device-driver error,
# comment out the `deploy:` block below — the app then runs on CPU (slow, a warning is shown in the UI).

services:
  app:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../projects:/data/projects
      - ../Datasets:/data/datasets
      - ../weights:/data/weights
    environment:
      AITEM_PROJECTS_DIR: /data/projects
      AITEM_DATASETS_DIR: /data/datasets
      AITEM_WEIGHTS_DIR: /data/weights
      HOST_UID: "${HOST_UID:-1000}"
      HOST_GID: "${HOST_GID:-1000}"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
